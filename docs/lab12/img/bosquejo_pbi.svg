  <text x="40" y="850" class="ts">Plantilla de cada página: barra de navegación → pregunta de gestión → tarjetas → filtros a la izquierda → gráficos con su ayuda.</text>
  <text x="40" y="870" class="ts">Si una selección no tiene datos, el título del gráfico lo dice con una medida DAX («No hay llegadas para esta combinación de vía y año»).</text>
  <text x="40" y="890" class="ts">Las cifras del bosquejo son ilustrativas salvo las tarjetas, que son las del Lab 10 para 2025.</text>
